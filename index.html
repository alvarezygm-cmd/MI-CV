<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Currículum interactivo y portafolio profesional de Yuleidy María Álvarez González - Gerente de Operaciones y Finanzas">
    <title>YULEIDY MARÍA ÁLVAREZ GONZÁLEZ | Currículum Interactivo</title>
    
    <!-- Iconos profesionales oficiales (Única dependencia externa válida) -->
    <script src="https://cloudflare.com"></script>
    
    <style>
        /* ==========================================================================
           VARIABLES Y CONFIGURACIÓN GENERAL (Paleta Negro, Blanco y Dorado)
           ========================================================================== */
        :root {
            --primary: #0a0a0a;       /* Negro Profundo */
            --secondary: #1a1a1a;     /* Negro Claro */
            --accent: #d4af37;        /* Dorado Metálico */
            --accent-hover: #aa8c2c;  /* Dorado Oscuro */
            --text-dark: #1e293b;     /* Texto Principal */
            --text-light: #f8fafc;    /* Texto Claro */
            --bg: #ffffff;            /* Blanco Puro */
            --bg-light: #f4f4f5;      /* Gris Muy Claro */
            --card-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* ==========================================================================
           HEADER Y NAVEGACIÓN
           ========================================================================== */
        header {
            background-color: var(--primary);
            color: var(--text-light);
            padding: 1.2rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--accent);
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: 1px;
            color: var(--text-light);
        }

        .logo span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        .nav-links a {
            color: #a1a1aa;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent);
        }

        /* ==========================================================================
           HERO SECTION (Presentación de Alto Impacto)
           ========================================================================== */
        .hero {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--text-light);
            padding: 6rem 2rem;
            text-align: center;
            position: relative;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--accent);
        }

        .hero-container {
            max-width: 850px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 2.6rem;
            margin-bottom: 0.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .hero h2 {
            font-size: 1.4rem;
            color: var(--accent);
            margin-bottom: 1.5rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .hero p {
            font-size: 1.1rem;
            color: #d4d4d8;
            margin-bottom: 2.5rem;
            text-align: justify;
        }

        .contact-badges {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
        }

        .badge {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--text-light);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            transition: all 0.3s;
        }

        .badge:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Botón de Descarga PDF */
        .cta-container {
            margin-top: 1rem;
        }

        .btn-download {
            background-color: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
            font-size: 1.1rem;
            font-weight: 600;
            padding: 0.8rem 2.2rem;
            border-radius: 4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-download:hover {
            background-color: var(--accent);
            color: var(--primary);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }

        /* ==========================================================================
           CONTENIDO PRINCIPAL Y SECCIONES
           ========================================================================== */
        main {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 0 2rem;
        }

        section {
            margin-bottom: 5rem;
            scroll-margin-top: 100px;
        }

        h3.section-title {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--bg-light);
            padding-bottom: 0.5rem;
        }

        h3.section-title i {
            color: var(--accent);
        }

        /* Bloques de Métricas Irrefutables */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 5rem;
        }

        .metric-card {
            background: var(--bg-light);
            padding: 2.5rem 2rem;
            border-radius: 4px;
            text-align: center;
            border: 1px solid #e4e4e7;
            border-top: 4px solid var(--primary);
            transition: all 0.3s;
        }

        .metric-card:hover {
            border-top-color: var(--accent);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transform: translateY(-3px);
        }

        .metric-val {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        .metric-card:nth-child(1) .metric-val,
        .metric-card:nth-child(2) .metric-val {
            color: var(--accent);
        }

        .metric-label {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-desc {
            font-size: 0.88rem;
            color: #71717a;
            margin-top: 0.5rem;
        }

        /* Sección Competencias */
        .skills-category {
            margin-bottom: 2rem;
        }

        .skills-category h4 {
            margin-bottom: 0.8rem;
            color: #52525b;
            font-size: 1.05rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .skills-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .skill-tag {
            background: var(--bg-light);
            color: var(--primary);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.92rem;
            font-weight: 500;
            border: 1px solid #e4e4e7;
            transition: all 0.3s;
        }

        .skill-tag:hover {
            background: var(--primary);
            color: var(--text-light);
            border-color: var(--primary);
        }

        .skill-tag.highlight {
            background: #fffbeb;
            color: #78350f;
            border: 1px solid #fde68a;
            font-weight: 600;
        }

        /* Filtros e Historial Laboral (Línea de tiempo) */
        .exp-filters {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .filter-btn {
            background: var(--bg-light);
            border: 1px solid #e4e4e7;
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s;
        }
