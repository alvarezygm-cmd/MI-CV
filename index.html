<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Currículum interactivo de Yuleidy María Álvarez González">
    <title>YULEIDY MARÍA ÁLVAREZ GONZÁLEZ | Currículum Interactivo</title>
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --primary: #0a0a0a;
            --secondary: #1a1a1a;
            --accent: #d4af37;
            --accent-hover: #aa8c2c;
            --text-dark: #1e293b;
            --text-light: #f8fafc;
            --bg: #ffffff;
            --bg-light: #f4f4f5;
            --card-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-dark);
            line-height: 1.6;
        }

        header {
            background-color: var(--primary);
            color: var(--text-light);
            padding: 1.2rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--accent);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        .nav-links a {
            color: #a1a1aa;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent);
        }

        .hero {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--text-light);
            padding: 5rem 2rem;
            text-align: center;
        }

        .hero-container {
            max-width: 850px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 2.4rem;
            margin-bottom: 0.5rem;
            font-weight: 800;
        }

        .hero h2 {
            font-size: 1.3rem;
            color: var(--accent);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .hero p {
            font-size: 1.05rem;
            color: #d4d4d8;
            margin-bottom: 2rem;
            text-align: justify;
        }

        .contact-badges {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .badge {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.85rem;
            color: var(--text-light);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-download {
            background-color: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
            font-size: 1rem;
            font-weight: 600;
            padding: 0.7rem 2rem;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-download:hover {
            background-color: var(--accent);
            color: var(--primary);
        }

        main {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        section {
            margin-bottom: 4rem;
            scroll-margin-top: 100px;
        }

        h3.section-title {
            font-size: 1.6rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            border-bottom: 2px solid var(--bg-light);
            padding-bottom: 0.5rem;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        .metric-card {
            background: var(--bg-light);
            padding: 2rem 1.5rem;
            border-radius: 4px;
            text-align: center;
            border: 1px solid #e4e4e7;
            border-top: 4px solid var(--primary);
        }

        .metric-val {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent);
        }

        .metric-label {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 0.5rem;
        }

        .metric-desc {
            font-size: 0.85rem;
            color: #71717a;
            margin-top: 0.25rem;
        }

        .skills-category {
            margin-bottom: 1.5rem;
        }

        .skills-category h4 {
            margin-bottom: 0.5rem;
            color: #52525b;
            font-size: 1rem;
            text-transform: uppercase;
        }

        .skills-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .skill-tag {
            background: var(--bg-light);
            color: var(--primary);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-size: 0.85rem;
            border: 1px solid #e4e4e7;
        }

        .skill-tag.highlight {
            background: #fffbeb;
            color: #78350f;
            border: 1px solid #fde68a;
            font-weight: 600;
        }

        .exp-filters {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .filter-btn {
            background: var(--bg-light);
            border: 1px solid #e4e4e7;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--primary);
            color: var(--text-light);
        }

        .timeline {
            border-left: 2px solid #e4e4e7;
            padding-left: 1.5rem;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 2rem;
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 4px;
            border: 1px solid #e4e4e7;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: calc(-1.5rem - 7px);
            top: 24px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            border: 3px solid var(--bg);
        }

        .exp-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .role {
            font-size: 1.15rem;
            font-weight: 700;
        }

        .company {
            color: var(--accent);
            font-weight: 600;
        }

        .duration {
            font-size: 0.8rem;
            background: var(--primary);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            color: var(--text-light);
        }

        .exp-body ul {
            list-style: none;
        }

        .exp-body li {
            position: relative;
            padding-left: 1.2rem;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
            color: #4b5563;
        }

        .exp-body li::before {
            content: "■";
            position: absolute;
            left: 0;
            color: var(--accent);
            font-size: 0.6rem;
            top: 2px;
        }

        .highlight-text {
            font-weight: 700;
            background-color: #fef08a;
            padding: 1px 4px;
        }

        .edu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .edu-card {
            padding: 1.5rem;
            border-radius: 4px;
            border: 1px solid #e4e4e7;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .edu-icon {
            background: var(--primary);
            color: var(--accent);
            width: 45px;
            height: 45px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .contact-section {
            background: var(--primary);
            color: var(--text-light);
            padding: 2.5rem;
            border-radius: 4px;
            border-top: 4px solid var(--accent);
            max-width: 700px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem;
            background: #18181b;
            border: 1px solid #3f3f46;
            border-radius: 4px;
